name: The Fear Network

on:
  workflow_dispatch:
    inputs:
      video_mode:
        description: "Video mode"
        required: true
        default: "long"
        type: choice
        options:
          - long
          - short

  schedule:
    # 20:00 UTC = 23:00 Egypt (UTC+3)
    # 23:00 UTC = 02:00 Egypt
    # 02:00 UTC = 05:00 Egypt
    #
    # First two slots = long-form
    # Third slot = short
    - cron: "0 20 * * *"
    - cron: "0 23 * * *"
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: the-fear-network
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TTS_HOME: ${{ github.workspace }}/.cache/tts
      COQUI_TOS_AGREED: "1"

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ========================================================
      # PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # ========================================================
      # XTTS CACHE
      # ========================================================
      - name: Cache XTTS model
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: xtts-v2-ubuntu-py311-v2
          restore-keys: |
            xtts-v2-ubuntu-py311-

      # ========================================================
      # SYSTEM DEPENDENCIES
      # ========================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      # ========================================================
      # PYTHON DEPENDENCIES
      # ========================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          # PyTorch 2.9.1 CPU
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.9.1 \
            torchaudio==2.9.1

          # Project requirements
          python -m pip install -r requirements.txt --no-deps

          # XTTS + compatible TorchCodec
          python -m pip install \
            coqui-tts==0.27.5 \
            torchcodec==0.9.0 \
            transformers==4.57.6

          # API libraries
          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            requests \
            groq

      # ========================================================
      # VIDEO MODE
      # ========================================================
      - name: Select scheduled video mode
        id: mode
        shell: bash
        run: |
          # Manual Run
          if [ -n "${{ inputs.video_mode }}" ]; then
            echo "VIDEO_MODE=${{ inputs.video_mode }}" >> "$GITHUB_ENV"
            echo "Manual mode selected: ${{ inputs.video_mode }}"
            exit 0
          fi

          # Scheduled Run
          hour="$(date -u +%H)"

          if [ "$hour" = "20" ] || [ "$hour" = "23" ]; then
            echo "VIDEO_MODE=long" >> "$GITHUB_ENV"
            echo "Scheduled mode: LONG"
          else
            echo "VIDEO_MODE=short" >> "$GITHUB_ENV"
            echo "Scheduled mode: SHORT"
          fi

      # ========================================================
      # VOICE
      # ========================================================
      - name: Verify voice reference
        run: |
          test -f voice.wav

          echo "Voice reference found:"
          ls -lh voice.wav

          echo "Voice duration:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 \
            voice.wav

      # ========================================================
      # RUN THE FEAR NETWORK
      # ========================================================
      - name: Run The Fear Network
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # This secret contains your GroqCloud key.
          GROQ_API_KEY: ${{ secrets.GROK_API_KEY }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

        run: |
          echo "=============================================="
          echo "THE FEAR NETWORK"
          echo "VIDEO_MODE=$VIDEO_MODE"
          echo "=============================================="

          python the_fear_network.py
