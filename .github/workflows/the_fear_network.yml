name: The Fear Network

on:
  workflow_dispatch:
    inputs:
      video_mode:
        description: "Video mode"
        required: true
        default: "long"
        type: choice
        options:
          - long
          - short
  schedule:
    # 20:00 UTC = 11:00 PM Egypt (during current Egypt UTC+3 period)
    # 23:00 UTC = 02:00 AM Egypt
    # 02:00 UTC = 05:00 AM Egypt
    # First two slots are long-form; third slot is the Short.
    - cron: "0 20 * * *"
    - cron: "0 23 * * *"
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: the-fear-network
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TTS_HOME: ${{ github.workspace }}/.cache/tts

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache XTTS model
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: xtts-v2-ubuntu-py311-v1
          restore-keys: |
            xtts-v2-ubuntu-py311-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1 torchaudio==2.9.1
          python -m pip install -r requirements.txt --no-deps
          python -m pip install coqui-tts==0.27.5
          python -m pip install torchcodec==0.16.0 transformers==4.57.6 google-api-python-client google-auth requests

      - name: Select scheduled video mode
        id: mode
        shell: bash
        run: |
          if [ -n "${{ inputs.video_mode }}" ]; then
            echo "VIDEO_MODE=${{ inputs.video_mode }}" >> "$GITHUB_ENV"
            exit 0
          fi

          hour="$(date -u +%H)"
          if [ "$hour" = "20" ] || [ "$hour" = "23" ]; then
            echo "VIDEO_MODE=long" >> "$GITHUB_ENV"
          else
            echo "VIDEO_MODE=short" >> "$GITHUB_ENV"
          fi

      - name: Verify voice reference
        run: |
          test -f voice.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice.wav

      - name: Run The Fear Network
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python the_fear_network.py
