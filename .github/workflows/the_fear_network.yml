name: The Fear Network

on:
  workflow_dispatch:

  schedule:
    # 23:00 Egypt (UTC+3)
    - cron: "0 20 * * *"

    # 02:00 Egypt (UTC+3)
    - cron: "0 23 * * *"

    # 05:00 Egypt (UTC+3)
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: the-fear-network
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TTS_HOME: ${{ github.workspace }}/.cache/tts
      COQUI_TOS_AGREED: "1"

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ========================================================
      # PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # ========================================================
      # XTTS CACHE
      # ========================================================
      - name: Cache XTTS model
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: xtts-v2-ubuntu-py311-v2
          restore-keys: |
            xtts-v2-ubuntu-py311-

      # ========================================================
      # SYSTEM DEPENDENCIES
      # ========================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      # ========================================================
      # PYTHON DEPENDENCIES
      # ========================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.9.1 \
            torchaudio==2.9.1

          python -m pip install -r requirements.txt --no-deps

          python -m pip install \
            coqui-tts==0.27.5 \
            torchcodec==0.9.0 \
            transformers==4.57.6

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            requests \
            groq

      # ========================================================
      # VOICE
      # ========================================================
      - name: Verify voice reference
        run: |
          test -f voice.wav

          echo "Voice reference found:"
          ls -lh voice.wav

          echo "Voice duration:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 \
            voice.wav

      # ========================================================
      # IDEA MEMORY
      # ========================================================
      - name: Prepare idea memory
        run: |
          mkdir -p data

          if [ ! -f data/used_ideas.txt ]; then
            printf '%s\n' \
              '# The Fear Network — consumed story ideas' \
              '# One line per successful YouTube upload.' \
              > data/used_ideas.txt
          fi

          echo "Idea memory:"
          wc -l data/used_ideas.txt

      # ========================================================
      # RUN THE FEAR NETWORK
      # ========================================================
      - name: Run The Fear Network
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "=============================================="
          echo "THE FEAR NETWORK"
          echo "THIS RUN WILL GENERATE BOTH FORMATS"
          echo "16:9 + 9:16"
          echo "=============================================="

          python the_fear_network.py

      # ========================================================
      # SAVE IDEA MEMORY TO GITHUB
      # ========================================================
      - name: Save used ideas
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/used_ideas.txt

          if git diff --cached --quiet; then
            echo "No new ideas to save."
          else
            git commit -m "Update used ideas"
            git push
          fi
